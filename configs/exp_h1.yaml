# Configuration for Phase 04 baselines B0/B1 and H1 generalization gap.
# Frozen via manifest config_hash (H12).
experiment: exp_h1
task: task_T1
model: muse-spark-1.3
max_output_tokens: 2048
timeout_s: 120
memory_mb: 1024

# Difficulty tuning (repair stream, tier 2 mass/friction):
# Tuned band verified by V3 positive control to sit in 30-80% success band (Gate G1).
difficulty:
  tier: 2
  bounds:
    x: [-0.15, 0.15]
    y: [-0.15, 0.15]
    yaw: [-0.5, 0.5]
    mass: [0.05, 5.2]
    friction: [0.1, 1.0]

# Paired experimental design:
# Each trajectory pairs 1 loop scenario with held_out_per_traj fresh scenarios.
# Both B0 and B1 evaluate on identical paired scenarios.
trajectories: 20
held_out_per_traj: 4
max_repair_rounds: 1
seed: 1000
