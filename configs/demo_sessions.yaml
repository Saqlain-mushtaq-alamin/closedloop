run_id: demo-sessions-01
target_sessions: 8
arm: B3
model: muse-spark-1.3
reasoning_effort: medium
max_output_tokens: 2048
timeout_s: 120
memory_mb: 1024
budget_cap_usd: 3.0

start_programs:
  - id: v1
    program_id: bec73dec45a88431
    path: runs/cert-mint-03/program_final.py
    sha256: bec73dec45a88431d2b6f705dfc26fe1e81f896bc4e72bf651a397cf89e6fc55
  - id: v2
    program_id: 5f74f7762ee1f378
