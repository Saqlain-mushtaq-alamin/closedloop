# Configuration for Phase 06 repair engine + H2 (B2 vs B1) + H3 (B3 vs B2).
# Frozen via manifest config_hash (H11, H12).
experiment: exp_h2h3
task: task_T1
model: muse-spark-1.3
max_output_tokens: 2048
timeout_s: 120
memory_mb: 1024
budget_cap_usd: 12.0

# Difficulty tuning (repair stream, tier 2 mass/friction):
difficulty:
  tier: 2
  bounds:
    x: [-0.15, 0.15]
    y: [-0.15, 0.15]
    yaw: [-0.5, 0.5]
    mass: [1.0, 11.5]
    friction: [0.1, 1.0]

# Repair protocol settings (Plan §10)
repair:
  max_rounds: 1
  falsifier_budget: 10
  acceptance:
    falsifier_rerun_budget: 5
    bisection_steps: 6
    nominal:
      x: 0.0
      y: 0.0
      yaw: 0.0
      mass: 1.0
      friction: 0.8
    param_order: ["x", "y", "yaw", "friction", "mass"]

# Experimental design (Plan §12)
# Arms evaluated: B1 (random feedback), B2 (falsifier text), B3 (falsifier + filmstrip)
# Plus A/A null control arm (B2_alt vs B2)
trajectories: 20
held_out_per_traj: 4
seed_base: 50000
seed_stream: repair
tolerance_v6: 0.05
bootstrap_resamples: 10000
