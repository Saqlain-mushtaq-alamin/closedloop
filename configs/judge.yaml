# Configuration for Phase 07 Vision Judge + Calibration (Gate G2).
# Frozen at gate (H11, H12).
experiment: exp_judge_g2
task: task_T1
model: muse-spark-1.3
segmentation_model: sam-3.1
segmentation_prompts:
  cube: "red cube"
  pad: "green pad"
prompt: |
  You are a vision judge for robot pick-and-place task T1 in simulation.
  Task Goal: The robot must pick up the cube and place it stably on top of the pad.
  Visual Grounding: The pad is the flat green rectangle on the table. The cube is the small red block.
  Examine the final camera image:
  1. Is the cube resting stably on top of the pad surface?
  2. Is the cube off the pad, tipped over on the table, or still held in air?

  Reply strictly with a single JSON object: {"pass": <bool>, "confidence": <float between 0 and 1>, "reason": "<short description>"}
combination_rule: geometric_and_spark
confidence_threshold: 0.70
max_output_tokens: 1024

camera:
  cameraTargetPosition: [0.15, 0.0, 0.05]
  distance: 0.6
  yaw: 45
  pitch: -35
  roll: 0
  upAxisIndex: 2
  fov: 60
  nearVal: 0.05
  farVal: 2.0
  width: 256
  height: 256

calibration:
  seed_base: 1000000
  stream: calibration
  target_successes: 300
  target_failures: 300
  margin_buckets: 4
  delta: 0.05
  heatmap_cells: 16
  g2_thresholds:
    tpr_lower_min: 0.85
    worst_bucket_fpr_upper_max: 0.15
    ceiling_min: 0.85
